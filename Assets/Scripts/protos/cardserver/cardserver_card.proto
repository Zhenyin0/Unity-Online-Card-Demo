import "common/common.proto";

package cardserver_card;

//协议主码 本服独有协议 占用 101-654 公共占用1-50 游戏公共占用50-100
enum main {
	cardserver_card = 402;
}
//协议子码 req res 占用1-80  通知占用80-100
enum sub {
	CMD_ReqLatestCard  = 1; 
	CMD_ResLatestCard  = 2;
	CMD_PlayerCardNotice  = 80;
}

message PlayerCardNotice{
	repeated common.Card card_list = 1; 
}

//获取最新物品信息
message ReqLatestCard{
	optional int64 player_id = 1;           //玩家ID
}

//回应最新物品信息
message ResLatestCard{
	repeated common.Card card_list = 1;     
}