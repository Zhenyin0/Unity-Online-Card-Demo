package hallserver_extral;

//协议主码 本服独有协议 占用 101-654 公共占用1-50 游戏公共占用50-100
enum main {
	hallserver_extral = 107;
}
//协议子码 req res 占用1-80  通知占用80-100
enum sub {
	CMD_ToReleaseExtralHallReq  = 1;
	CMD_ToReleaseExtralHallRes  = 2;
	CMD_ExtralHallBackHallReq = 3;
	CMD_ExtralHallBackHallRes = 4;
}

//结束大厅释放对局房间
message ToReleaseExtralHallReq{
	optional int64 player_id = 1;           //玩家ID
}

//结束大厅释放对局房间
message ToReleaseExtralHallRes{
	optional int64 player_id = 1;           //玩家ID    
}

//对局房间结束回到大厅
message ExtralHallBackHallReq{
	optional int64 player_id = 1;           //玩家ID
}

//对局房间结束回到大厅
message ExtralHallBackHallRes{
	optional int64 player_id = 1;           //玩家ID    
}