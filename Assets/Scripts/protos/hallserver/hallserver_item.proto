// 1. 【必须加】在文件最顶部添加这一行（解决引用报错）
import "common/common.proto";

package hallserver_item;

//协议主码 本服独有协议 占用 101-654 公共占用1-50 游戏公共占用50-100
enum main {
	hallserver_item = 102;
}
//协议子码 req res 占用1-80  通知占用80-100
// 2. 【修改枚举名】加前缀，解决重名报错
enum sub {
	CMD_ReqLatestItem = 1;
	CMD_ResLatestItem = 2;
	CMD_ItemListNotice = 80;
}


message ItemListNotice {
    repeated common.Item item_list = 1;
}

//获取最新物品信息
message ReqLatestItem{
	optional int64 player_id = 1;           //玩家ID
}

//回应最新物品信息
message ResLatestItem{
    repeated common.Item item_list = 1;     
}
